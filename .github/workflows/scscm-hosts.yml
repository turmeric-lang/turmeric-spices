name: scscm hosts

# tur-scscm's output checked against real SuperCollider
# (turmeric docs/upcoming/spices/scscm-host-testing-plan.md, T2-T4):
#   - every corpus program's expected sclang parses in stock sclang;
#   - the sound-making ones render on scsynth and pass their audio checks.
#
# The tur side (compiling the corpus and comparing it to the expected files)
# runs in the ordinary CI shards through `tur test`. This job needs no tur:
# it checks the checked-in expected files, so it only installs SuperCollider.
# The versions are pinned in spices/scscm/tests/host/HOSTS; change both
# together. The hcsynth leg is not here yet (see HOSTS).
on:
  push:
    branches: [main]
    paths:
      - "spices/scscm/**"
      - ".github/workflows/scscm-hosts.yml"
  pull_request:
    branches: [main]
    paths:
      - "spices/scscm/**"
      - ".github/workflows/scscm-hosts.yml"
  workflow_dispatch:

concurrency:
  group: scscm-hosts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scsynth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install SuperCollider (pinned in spices/scscm/tests/host/HOSTS)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            supercollider-server=1:3.13.0+repack-1ubuntu3 \
            supercollider-language=1:3.13.0+repack-1ubuntu3
          sclang -v || true

      - name: Expected sclang parses (check-sclang.sh)
        run: spices/scscm/tests/corpus/check-sclang.sh

      - name: Audio checks on scsynth (render.sh)
        run: spices/scscm/tests/host/render.sh --host scsynth --keep "$RUNNER_TEMP/renders"

      - name: Keep the renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scscm-renders
          path: ${{ runner.temp }}/renders
          if-no-files-found: ignore
